spring.application.name=OrderService

# DB config

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/fitfusion_order_service_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}

spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:manager}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.open-in-view=false

spring.jpa.show-sql=true

spring.jpa.hibernate.ddl-auto=update

# Server

server.port=9090

# JWT

jwt.secret=${JWT_SECRET:jhfafjugsfkjagkfiuaghkjbajnfvkaufiaf,jbfkaugfiahfajfvkadfkafjuaf}

jwt.expiration=${JWT_EXPIRATION:86400000}

# Razorpay

razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_TKtuuwgGi56dVE}

razorpay.key.secret=${RAZORPAY_KEY_SECRET:cdTKt7bXJEpkOvMRWHClpFgm}

razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:mock_webhook_secret_67890}

# Service URLs

service.user.base-url=${SERVICE_USER_BASE_URL:http://localhost:9091}

service.catalog.base-url=${SERVICE_CATALOG_BASE_URL:http://localhost:9092}

service.invoice.base-url=${SERVICE_INVOICE_BASE_URL:http://localhost:9093}
