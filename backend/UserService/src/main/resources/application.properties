spring.application.name=userservice

# DB config

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/userservice?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}

spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:manager}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.open-in-view=false

spring.jpa.show-sql=true

spring.jpa.hibernate.ddl-auto=update

# default server port 8080

server.port=9091

# jwt

# 32 char secret key

jwt.secret=${JWT_SECRET:jhfafjugsfkjagkfiuaghkjbajnfvkaufiaf,jbfkaugfiahfajfvkadfkafjuaf}

jwt.expiration=${JWT_EXPIRATION:86400000}
