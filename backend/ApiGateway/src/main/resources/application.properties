spring.application.name=api-gateway
server.port=8085

# ---------- CORS ----------
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOriginPatterns=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true

# ---------- Order Service ----------
spring.cloud.gateway.routes[0].id=order-service
spring.cloud.gateway.routes[0].uri=http://order-service:9090
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/orders/**,/api/payments/**,/api/payouts/**,/api/return-requests/**,/api/return-actions/**,/api/refunds/**,/api/exchanges/**

# ---------- User Service ----------
spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=http://user-service:9091
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/auth/**,/api/commission-rules/**,/api/discount-rules/**,/api/users/**,/api/retailers/**,/api/addresses/**,/api/admin/**

# ---------- Catalog Service ----------
spring.cloud.gateway.routes[2].id=catalog-service
spring.cloud.gateway.routes[2].uri=http://catalog-service:9092
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/inventory/**,/api/products/**,/api/categories/**,/api/subcategories/**,/api/brands/**,/api/attribute/**

# ---------- AI Service ----------
spring.cloud.gateway.routes[3].id=ai-service
spring.cloud.gateway.routes[3].uri=http://ai-chatbot:8000
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/ai/**
spring.cloud.gateway.routes[3].filters[0]=StripPrefix=2
